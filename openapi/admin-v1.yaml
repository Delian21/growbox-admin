# ============================================================================
# GrowBox Admin API — Phase 1 + Phase 2 (quality gates) contract
# ============================================================================
# Scope: auth, orders, disputes, vendors, listings, payouts, audit log (ARCHITECTURE.md §6).
# Phase 2 additions: listings approval queue, payout batches + calculator,
# reviewer comment threads, and the ?counts=status summary facet.
# Source of truth for entity shapes (ADR-002 consequence): this file is the
# contract; packages/api-client is GENERATED from it (`pnpm --filter
# @growbox/api-client generate`). Never hand-write these types elsewhere.
#
# Cross-cutting rules (ARCHITECTURE.md §6), encoded here:
#   1. reason — required on every state/money mutation; written to the
#      append-only audit log with actor, before/after, IP.
#   2. Idempotency-Key header — REQUIRED on money operations (dispute
#      resolution). Retries with the same key must not double-move money.
#   3. Cursor pagination — every list endpoint takes ?cursor&limit and
#      returns { data, next_cursor, prev_cursor }.
#
# Consciously documented deviation: POST /disputes/{id}/comments is exempt
# from the reason rule — the comment body IS the record; still audit-logged
# with actor + timestamp.
#
# NOTE: monetary amounts are integer minor units (cents) — *_cents — to keep
# money math exact. Swap to the platform currency field set when ADR-004 lands.
# ============================================================================

openapi: 3.1.0
info:
  title: GrowBox Admin API
  version: 1.0.0-phase1
  description: >-
    Admin-scope API for the GrowBox agricultural marketplace.
    All routes require an admin JWT with a role claim (SUPER_ADMIN | OPS |
    FINANCE | SUPPORT). Authorization is enforced server-side on every
    endpoint; client-side RBAC is UX only (ARCHITECTURE.md §2, §9).
servers:
  - url: /admin/v1
security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------- auth ----
  /auth/login:
    post:
      operationId: authLogin
      summary: Password login (step 1 of 2 — 2FA is mandatory, §9)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Credentials accepted; MFA challenge issued.
          content:
            application/json:
              schema:
                type: object
                required: [mfa_required, mfa_token]
                additionalProperties: false
                properties:
                  mfa_required:
                    type: boolean
                    const: true
                    description: Always true — admins cannot skip 2FA.
                  mfa_token:
                    type: string
                    description: Short-lived challenge token for /auth/mfa/verify.
        "401":
          $ref: "#/components/responses/Error401"

  /auth/mfa/verify:
    post:
      operationId: authMfaVerify
      summary: Verify the 2FA challenge and receive the admin JWT (step 2 of 2)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfa_token, code]
              additionalProperties: false
              properties:
                mfa_token:
                  type: string
                code:
                  type: string
                  minLength: 6
                  maxLength: 8
                  description: TOTP code.
      responses:
        "200":
          description: Authenticated. JWT carries the role claim checked on every route.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in, admin]
                additionalProperties: false
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    const: Bearer
                  expires_in:
                    type: integer
                    description: Session lifetime in seconds — short-lived per §9.
                  admin:
                    $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Error401"

  # -------------------------------------------------------------- orders ----
  /orders:
    get:
      operationId: listOrders
      summary: Order oversight list with filters (§6 Orders)
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: sla
          in: query
          schema:
            type: string
            enum: [breached]
          description: Only orders with a breached SLA timer.
        - name: vendor_id
          in: query
          schema:
            type: string
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Cursor page of orders (newest first).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPage"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"

  /orders/{order_id}:
    get:
      operationId: getOrder
      summary: Order detail — full timeline, overrides, SLA timer
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"

  /orders/{order_id}/status-override:
    post:
      operationId: overrideOrderStatus
      summary: Manual status override (admin may override transitions, §2)
      description: >-
        Legal transitions mirror the §5 state machine — PLACED → ACCEPTED →
        PACKED → SHIPPED → DELIVERED, with CANCELLED reachable before SHIPPED
        and REFUNDED reachable from SHIPPED/DELIVERED. Illegal hops return 409.
        Audited with actor, from/to, reason.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ReasonRequest"
                - type: object
                  required: [to]
                  additionalProperties: false
                  properties:
                    to:
                      $ref: "#/components/schemas/OrderStatus"
      responses:
        "200":
          description: Updated order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"

  /orders/{order_id}/assign-logistics:
    post:
      operationId: assignLogistics
      summary: Assign a 3PL provider and tracking reference
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ReasonRequest"
                - type: object
                  required: [provider, tracking_ref]
                  additionalProperties: false
                  properties:
                    provider:
                      type: string
                      minLength: 1
                    tracking_ref:
                      type: string
                      minLength: 1
      responses:
        "200":
          description: Updated order with assigned_logistics set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"

  # ------------------------------------------------------------ disputes ----
  /disputes:
    get:
      operationId: listDisputes
      summary: Dispute list with filters (§6 Disputes)
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DisputeStatus"
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/DisputeCategory"
      responses:
        "200":
          description: Cursor page of disputes (oldest open first).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisputePage"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"

  /disputes/{dispute_id}:
    get:
      operationId: getDispute
      summary: Dispute detail with thread and resolution
      parameters:
        - $ref: "#/components/parameters/DisputeId"
      responses:
        "200":
          description: The dispute.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispute"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"

  /disputes/{dispute_id}/start-review:
    post:
      operationId: startDisputeReview
      summary: Move an OPEN dispute into review (OPEN → UNDER_REVIEW)
      parameters:
        - $ref: "#/components/parameters/DisputeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: Dispute now UNDER_REVIEW.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispute"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"

  /disputes/{dispute_id}/resolve:
    post:
      operationId: resolveDispute
      summary: Resolve with refund / wallet credit / partial reconciliation
      description: >-
        MONEY OPERATION — requires the Idempotency-Key header; retries with
        the same key return the original result instead of double-crediting
        (§5 invariant). Sets status to RESOLVED_REFUND, RESOLVED_CREDIT or
        RESOLVED_PARTIAL_RECON per `type`.
      parameters:
        - $ref: "#/components/parameters/DisputeId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ReasonRequest"
                - type: object
                  required: [type, amount_cents]
                  additionalProperties: false
                  properties:
                    type:
                      type: string
                      enum: [REFUND, WALLET_CREDIT, PARTIAL]
                    amount_cents:
                      type: integer
                      minimum: 1
                      description: Must be ≤ amount_disputed_cents (422 otherwise).
      responses:
        "200":
          description: Resolved dispute with resolution stamped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispute"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"

  /disputes/{dispute_id}/comments:
    post:
      operationId: addDisputeComment
      summary: Append a note to the dispute thread
      description: >-
        Exempt from the reason rule (documented deviation): the comment body is
        the record. Still audit-logged with actor + timestamp.
      parameters:
        - $ref: "#/components/parameters/DisputeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              additionalProperties: false
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        "201":
          description: The created comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisputeComment"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"

  # ------------------------------------------------------------- vendors ----
  /vendors:
    get:
      operationId: listVendors
      summary: Vendor list with status and performance filters (§6 Vendors)
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/VendorStatus"
        - name: performance
          in: query
          schema:
            type: string
            enum: [poor]
          description: >-
            Vendors breaching performance thresholds (cancellation or
            late-shipment rate, or spoilage complaints above target).
      responses:
        "200":
          description: Cursor page of vendors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorPage"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"

  /vendors/{vendor_id}:
    get:
      operationId: getVendor
      summary: Vendor profile with performance meters and warning history
      parameters:
        - $ref: "#/components/parameters/VendorId"
      responses:
        "200":
          description: The vendor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"

  /vendors/{vendor_id}/warn:
    post:
      operationId: warnVendor
      summary: Issue a formal warning (appends to warning_history)
      parameters:
        - $ref: "#/components/parameters/VendorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: Vendor with the warning appended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"

  /vendors/{vendor_id}/suspend:
    post:
      operationId: suspendVendor
      summary: Suspend a vendor (APPROVED → SUSPENDED)
      parameters:
        - $ref: "#/components/parameters/VendorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: Vendor suspended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"

  /vendors/{vendor_id}/reinstate:
    post:
      operationId: reinstateVendor
      summary: Reinstate a suspended or banned vendor (→ APPROVED)
      parameters:
        - $ref: "#/components/parameters/VendorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: Vendor reinstated to APPROVED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"

  /vendors/{vendor_id}/ban:
    post:
      operationId: banVendor
      summary: Ban a vendor (APPROVED|SUSPENDED → BANNED)
      parameters:
        - $ref: "#/components/parameters/VendorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: Vendor banned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"

  /vendors/{vendor_id}/kyc-review:
    post:
      operationId: reviewVendorKyc
      summary: KYC review — open, then verify or reject (§5 vendor machine)
      description: >-
        Three legal actions, each gated by the current vendor status so the
        §5 machine (PENDING_KYC → KYC_REVIEW → APPROVED) stays intact.
        `open` moves PENDING_KYC → KYC_REVIEW. `verify` moves
        KYC_REVIEW → APPROVED and stamps every pending document VERIFIED.
        `reject` marks the submitted documents REJECTED but deliberately
        leaves the vendor in KYC_REVIEW (no status hop) — the vendor
        resubmits and review continues. Illegal moves return 409. Audited.
      parameters:
        - $ref: "#/components/parameters/VendorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, reason]
              additionalProperties: false
              properties:
                action:
                  type: string
                  enum: [open, verify, reject]
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
                  description: >-
                    Why this action is being taken; written to the
                    append-only audit log (ARCHITECTURE.md §5 invariant).
                notes:
                  type: string
                  maxLength: 1000
                  description: Reviewer notes stamped onto the documents.
      responses:
        "200":
          description: Updated vendor with refreshed KYC documents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"

  # ---------------------------------------------------------- promotions ----
  /promotions:
    get:
      operationId: listPromotions
      summary: Discount codes and seasonal campaigns (§6 Promotions)
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Counts"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PromotionStatus"
      responses:
        "200":
          description: Cursor page of promotions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionPage"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
    post:
      operationId: createPromotion
      summary: Create a promotion code (starts as DRAFT, reason required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, code, type, scope, starts_at, ends_at, usage_limit]
              additionalProperties: false
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
                code:
                  type: string
                  minLength: 3
                  maxLength: 24
                  description: Customer-facing coupon code, uppercased on the way in.
                type:
                  type: string
                  enum: [PERCENT, FIXED, FREE_SHIPPING]
                value:
                  type: integer
                  minimum: 0
                  description: >-
                    PERCENT → whole percent (50 = 50%); FIXED → kobo; required
                    for both, ignored for FREE_SHIPPING.
                scope:
                  type: string
                  enum: [GLOBAL, CATEGORY, VENDOR]
                scope_ref:
                  type: string
                  description: Category slug or vendor id when scope is not GLOBAL.
                starts_at:
                  type: string
                  format: date-time
                ends_at:
                  type: string
                  format: date-time
                usage_limit:
                  type: integer
                  minimum: 1
      responses:
        "201":
          description: The created promotion (status DRAFT).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Promotion"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"

  /promotions/{promotion_id}/schedule:
    post:
      operationId: schedulePromotion
      summary: Schedule a DRAFT promotion (DRAFT → SCHEDULED, reason required)
      description: >-
        Activation itself is time-driven (starts_at → ends_at) and is
        evaluated when the promotion was scheduled; the mock models the
        admin decision only, because a browser-side mock has no scheduler.
        Illegal hops return 409.
      parameters:
        - $ref: "#/components/parameters/PromotionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: The scheduled promotion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Promotion"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"

  /promotions/{promotion_id}/end:
    post:
      operationId: endPromotion
      summary: End a promotion early (SCHEDULED|LIVE → ENDED, reason required)
      parameters:
        - $ref: "#/components/parameters/PromotionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: The ended promotion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Promotion"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"

  # -------------------------------------------------------- notifications ----
  /notifications:
    get:
      operationId: listNotifications
      summary: Broadcast composer history (audience + scheduling)
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: audience
          in: query
          schema:
            $ref: "#/components/schemas/NotificationAudience"
      responses:
        "200":
          description: Cursor page of notifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
    post:
      operationId: createNotification
      summary: Compose a broadcast (reason required)
      description: >-
        Draft with no scheduled_at is ready to send; with a scheduled_at it is
        queued. Sending is a separate call so a queued message can be reviewed
        before it leaves.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, audience, title, body]
              additionalProperties: false
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
                audience:
                  $ref: "#/components/schemas/NotificationAudience"
                title:
                  type: string
                  minLength: 1
                  maxLength: 120
                body:
                  type: string
                  minLength: 1
                  maxLength: 2000
                scheduled_at:
                  type: string
                  format: date-time
      responses:
        "201":
          description: The created notification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"

  /notifications/{notification_id}/send:
    post:
      operationId: sendNotification
      summary: Send a queued notification now (reason required)
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: The sent notification (status SENT).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"

  # ------------------------------------------------------------ analytics ----
  /analytics/gmv:
    get:
      operationId: analyticsGmv
      summary: Daily GMV and take rate for the trailing window
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        "200":
          description: One row per day (oldest first), zero-filled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsGmv"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"

  /analytics/take-rate:
    get:
      operationId: analyticsTakeRate
      summary: Commission actually collected as a share of GMV
      responses:
        "200":
          description: Take-rate summary over the trailing window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsTakeRate"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"

  /analytics/vendor-leaderboard:
    get:
      operationId: analyticsVendorLeaderboard
      summary: Vendors ranked by GMV, with their quality signals
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Ranked vendors (best GMV first).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardRow"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"

  /analytics/spoilage:
    get:
      operationId: analyticsSpoilage
      summary: Quality-signal rates (cancellation, late shipment, spoilage)
      responses:
        "200":
          description: Platform-wide rates over the trailing window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsQuality"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"

  # ---------------------------------------------------------------- audit ----
  /audit:
    get:
      operationId: listAuditLog
      summary: Read-only audit trail (append-only — there is no write path)
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: actor
          in: query
          schema:
            type: string
          description: actor_admin_id filter.
        - name: entity_type
          in: query
          schema:
            $ref: "#/components/schemas/AuditEntityType"
        - name: entity_id
          in: query
          schema:
            type: string
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Cursor page of audit entries (newest first).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogPage"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"

  # ---------------------------------------------------------- listings ----
  /listings:
    get:
      operationId: listListings
      summary: Product approval queue (nothing publishes without review)
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Counts"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ListingStatus"
        - name: vendor_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Cursor page of listings (actionable first; DRAFT never enters the queue ranking).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingPage"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"

  /listings/{listing_id}:
    get:
      operationId: getListing
      summary: Listing detail — review history and reviewer discussion thread
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "200":
          description: The listing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"

  /listings/{listing_id}/approve:
    post:
      operationId: approveListing
      summary: Approve a PENDING_REVIEW listing (reason required)
      parameters:
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: Updated listing with an APPROVED review-history entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"

  /listings/{listing_id}/reject:
    post:
      operationId: rejectListing
      summary: Reject a PENDING_REVIEW listing (reason required)
      parameters:
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: Updated listing with a REJECTED review-history entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"

  /listings/{listing_id}/archive:
    post:
      operationId: archiveListing
      summary: Archive a live or rejected listing (reason required)
      parameters:
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: Updated listing with an ARCHIVED review-history entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"

  /listings/{listing_id}/comments:
    post:
      operationId: addListingComment
      summary: Post a reviewer note on a listing (no reason — body is the record)
      description: >-
        Consciously documented deviation from the reason rule, mirroring
        POST /disputes/{dispute_id}/comments: the comment body IS the record.
        Still audit-logged (listing.comment) with actor + timestamp.
      parameters:
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              additionalProperties: false
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        "201":
          description: The created comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingComment"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"

  # ------------------------------------------------------------ payouts ----
  /payouts:
    get:
      operationId: listPayouts
      summary: Payout batch queue (actionable batches first, oldest period first)
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Counts"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PayoutStatus"
        - name: vendor_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Cursor page of payout batches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutPage"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"

  /payouts/{payout_id}:
    get:
      operationId: getPayout
      summary: Payout batch detail — amount breakdown and decision history
      parameters:
        - $ref: "#/components/parameters/PayoutId"
      responses:
        "200":
          description: The payout batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payout"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"

  /payouts/calculate:
    post:
      operationId: calculatePayout
      summary: Derive a batch from a vendor's orders over a period
      description: >-
        Sums the vendor's orders in [period_start, period_end], excluding
        CANCELLED and REFUNDED sales (they never settle), and derives gross /
        commission / net. Declines with 422 when no orders are eligible, when
        the commission would consume the whole batch, or when caller-supplied
        gross/commission disagree with what the orders sum to (amount
        invariant). Declines with 409 when a live batch already covers that
        vendor + period. Non-money (it only computes) — audited as
        payout.calculate, no idempotency key required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ReasonRequest"
                - type: object
                  required: [vendor_id, period_start, period_end]
                  additionalProperties: false
                  properties:
                    vendor_id:
                      type: string
                    period_start:
                      type: string
                      format: date
                    period_end:
                      type: string
                      format: date
                    gross_cents:
                      type: integer
                      description: Optional claim to validate against the order ledger (422 on mismatch).
                    commission_cents:
                      type: integer
                      description: Optional claim to validate against the order ledger (422 on mismatch).
      responses:
        "201":
          description: The created batch (status CALCULATED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payout"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"

  /payouts/{payout_id}/submit:
    post:
      operationId: submitPayout
      summary: Submit a CALCULATED batch for approval (reason required)
      parameters:
        - $ref: "#/components/parameters/PayoutId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: Updated batch (CALCULATED → PENDING_APPROVAL).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payout"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"

  /payouts/{payout_id}/approve:
    post:
      operationId: approvePayout
      summary: Approve a PENDING_APPROVAL batch (reason required)
      parameters:
        - $ref: "#/components/parameters/PayoutId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: Updated batch (PENDING_APPROVAL → APPROVED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payout"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"

  /payouts/{payout_id}/mark-paid:
    post:
      operationId: markPayoutPaid
      summary: Bank transfer confirmation (MONEY OP — idempotency key required)
      description: >-
        Marks an APPROVED batch PAID. Money operation per §5: the
        Idempotency-Key header is REQUIRED, the batch is never optimistically
        updated client-side, and a retry with the same key replays the
        original answer instead of paying twice.
      parameters:
        - $ref: "#/components/parameters/PayoutId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: Updated batch (APPROVED → PAID).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payout"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"

  /payouts/{payout_id}/retry:
    post:
      operationId: retryPayout
      summary: Retry a FAILED batch back into the approval queue (reason required)
      parameters:
        - $ref: "#/components/parameters/PayoutId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: Updated batch (FAILED → PENDING_APPROVAL).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payout"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque pagination cursor from a previous response.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Page size (1–100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    OrderId:
      name: order_id
      in: path
      required: true
      schema:
        type: string
    DisputeId:
      name: dispute_id
      in: path
      required: true
      schema:
        type: string
    VendorId:
      name: vendor_id
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Client-supplied key (e.g. a UUID) making this money operation
        idempotent — retries return the original result (§5 invariant).
      schema:
        type: string
        minLength: 8
    ListingId:
      name: listing_id
      in: path
      required: true
      schema:
        type: string
    PayoutId:
      name: payout_id
      in: path
      required: true
      schema:
        type: string
    PromotionId:
      name: promotion_id
      in: path
      required: true
      schema:
        type: string
    NotificationId:
      name: notification_id
      in: path
      required: true
      schema:
        type: string
    Counts:
      name: counts
      in: query
      description: >-
        Request summary facets alongside the page. `status` adds
        total_by_status, tallied BEFORE the status filter is applied, so
        dashboard/toolbar counts stay correct beyond the first page.
      schema:
        type: string
        enum: [status]

  schemas:
    # -- shared ------------------------------------------------------------
    Role:
      type: string
      enum: [SUPER_ADMIN, OPS, FINANCE, SUPPORT]

    ReasonRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
          description: >-
            Why this action is being taken. Written to the append-only audit
            log with actor, before/after, IP (ARCHITECTURE.md §5 invariant).

    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              enum:
                [BAD_REQUEST, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, UNPROCESSABLE, INTERNAL]
            message:
              type: string
            details:
              type: object
              additionalProperties: true
              description: Field-level details, e.g. which transition was illegal.

    # -- people ------------------------------------------------------------
    AdminUser:
      type: object
      required: [id, name, email, role, mfa_enrolled, status]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        mfa_enrolled:
          type: boolean
        status:
          type: string
          enum: [ACTIVE, DISABLED]

    # -- orders ------------------------------------------------------------
    OrderStatus:
      type: string
      enum: [PLACED, ACCEPTED, PACKED, SHIPPED, DELIVERED, CANCELLED, REFUNDED]
      description: >-
        §5 state machine — PLACED → ACCEPTED → PACKED → SHIPPED → DELIVERED;
        CANCELLED from PLACED/ACCEPTED/PACKED; REFUNDED from
        SHIPPED/DELIVERED. Admin overrides may only follow legal hops.

    OrderItem:
      type: object
      required: [listing_id, name, quantity_kg, unit_price_cents, total_cents]
      additionalProperties: false
      properties:
        listing_id:
          type: string
        name:
          type: string
        quantity_kg:
          type: number
          minimum: 0
        unit_price_cents:
          type: integer
          minimum: 0
        total_cents:
          type: integer
          minimum: 0

    OrderTotals:
      type: object
      required: [subtotal_cents, delivery_fee_cents, discount_cents, total_cents, commission_amount_cents]
      additionalProperties: false
      properties:
        subtotal_cents:
          type: integer
          minimum: 0
        delivery_fee_cents:
          type: integer
          minimum: 0
        discount_cents:
          type: integer
          minimum: 0
        total_cents:
          type: integer
          minimum: 0
        commission_amount_cents:
          type: integer
          minimum: 0

    OrderStatusOverride:
      type: object
      required: [admin_id, from, to, reason, at]
      additionalProperties: false
      properties:
        admin_id:
          type: string
        from:
          $ref: "#/components/schemas/OrderStatus"
        to:
          $ref: "#/components/schemas/OrderStatus"
        reason:
          type: string
        at:
          type: string
          format: date-time

    AssignedLogistics:
      type: object
      required: [provider, tracking_ref, at]
      additionalProperties: false
      properties:
        provider:
          type: string
        tracking_ref:
          type: string
        at:
          type: string
          format: date-time

    SlaTimer:
      type: object
      required: [type, threshold_hours, breached, escalated]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [UNSHIPPED, UNANSWERED_DISPUTE]
        threshold_hours:
          type: integer
          minimum: 1
        breached:
          type: boolean
        breached_at:
          type: string
          format: date-time
        escalated:
          type: boolean

    Order:
      type: object
      required: [id, customer, vendor_id, vendor_name, items, totals, status, created_at, updated_at, admin_overrides, sla]
      additionalProperties: false
      properties:
        id:
          type: string
        customer:
          type: object
          required: [id, name]
          additionalProperties: false
          properties:
            id:
              type: string
            name:
              type: string
        vendor_id:
          type: string
        vendor_name:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        totals:
          $ref: "#/components/schemas/OrderTotals"
        status:
          $ref: "#/components/schemas/OrderStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        admin_overrides:
          type: array
          items:
            $ref: "#/components/schemas/OrderStatusOverride"
        assigned_logistics:
          $ref: "#/components/schemas/AssignedLogistics"
        sla:
          $ref: "#/components/schemas/SlaTimer"
          description: UNSHIPPED timer for orders not yet SHIPPED; escalated flag set when past threshold + grace.

    OrderPage:
      type: object
      required: [data, next_cursor, prev_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        next_cursor:
          type: [string, "null"]
        prev_cursor:
          type: [string, "null"]

    # -- disputes ------------------------------------------------------------
    DisputeCategory:
      type: string
      enum: [SPOILAGE, DAMAGE, WRONG_ITEM, NOT_DELIVERED, OTHER]

    DisputeStatus:
      type: string
      enum: [OPEN, UNDER_REVIEW, RESOLVED_REFUND, RESOLVED_CREDIT, RESOLVED_PARTIAL_RECON, REJECTED, CLOSED]

    DisputeComment:
      type: object
      required: [id, author_admin_id, body, at]
      additionalProperties: false
      properties:
        id:
          type: string
        author_admin_id:
          type: string
        body:
          type: string
        at:
          type: string
          format: date-time

    DisputeResolution:
      type: object
      required: [type, amount_cents, admin_id, notes, at]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [REFUND, WALLET_CREDIT, PARTIAL]
        amount_cents:
          type: integer
          minimum: 0
        admin_id:
          type: string
        notes:
          type: string
        at:
          type: string
          format: date-time

    Dispute:
      type: object
      required: [id, order_id, opened_by, category, status, description, amount_disputed_cents, opened_at, comments]
      additionalProperties: false
      properties:
        id:
          type: string
        order_id:
          type: string
        opened_by:
          type: string
          enum: [CUSTOMER, VENDOR]
        category:
          $ref: "#/components/schemas/DisputeCategory"
        status:
          $ref: "#/components/schemas/DisputeStatus"
        description:
          type: string
        amount_disputed_cents:
          type: integer
          minimum: 0
        opened_at:
          type: string
          format: date-time
        resolution:
          $ref: "#/components/schemas/DisputeResolution"
        comments:
          type: array
          items:
            $ref: "#/components/schemas/DisputeComment"
        sla:
          $ref: "#/components/schemas/SlaTimer"
          description: UNANSWERED_DISPUTE timer while OPEN/UNDER_REVIEW.

    DisputePage:
      type: object
      required: [data, next_cursor, prev_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Dispute"
        next_cursor:
          type: [string, "null"]
        prev_cursor:
          type: [string, "null"]

    # -- vendors -------------------------------------------------------------
    VendorStatus:
      type: string
      enum: [PENDING_KYC, KYC_REVIEW, APPROVED, SUSPENDED, BANNED]
      description: §5 lifecycle — PENDING_KYC → KYC_REVIEW → APPROVED → SUSPENDED | BANNED (reversible to APPROVED).

    VendorPerformance:
      type: object
      required: [cancellation_rate, late_shipment_rate, spoilage_complaints, rating]
      additionalProperties: false
      properties:
        cancellation_rate:
          type: number
          minimum: 0
          maximum: 1
        late_shipment_rate:
          type: number
          minimum: 0
          maximum: 1
        spoilage_complaints:
          type: integer
          minimum: 0
        rating:
          type: number
          minimum: 0
          maximum: 5

    VendorWarning:
      type: object
      required: [id, reason, admin_id, at]
      additionalProperties: false
      properties:
        id:
          type: string
        reason:
          type: string
        admin_id:
          type: string
        at:
          type: string
          format: date-time

    KycDocumentStatus:
      type: string
      enum: [PENDING, VERIFIED, REJECTED]
      description: >-
        Document-level verdict. Independent of the vendor status: a rejected
        document leaves the vendor in KYC_REVIEW so it can be resubmitted.

    KycDocument:
      type: object
      required: [id, vendor_id, type, file_url, status, uploaded_at]
      additionalProperties: false
      properties:
        id:
          type: string
        vendor_id:
          type: string
        type:
          type: string
          enum: [FARM_REGISTRATION, LAND_DEED, ORGANIC_CERT, BANK_DETAILS]
        file_url:
          type: string
          description: >-
            Reference the document viewer renders. Demo fixtures are inline
            SVG data URIs (CSP img-src allows 'self' data:), so no file
            backend is needed for the mock.
        status:
          $ref: "#/components/schemas/KycDocumentStatus"
        uploaded_at:
          type: string
          format: date-time
        reviewed_by_admin_id:
          type: string
          description: Set once a reviewer stamps a verdict.
        reviewed_at:
          type: string
          format: date-time
        notes:
          type: string
          description: Reviewer notes attached with the verdict.

    Vendor:
      type: object
      required: [id, business_name, owner, status, performance, warning_history, kyc_documents, created_at]
      additionalProperties: false
      properties:
        id:
          type: string
        business_name:
          type: string
        owner:
          type: object
          required: [name, email]
          additionalProperties: false
          properties:
            name:
              type: string
            email:
              type: string
              format: email
            phone:
              type: string
        status:
          $ref: "#/components/schemas/VendorStatus"
        performance:
          $ref: "#/components/schemas/VendorPerformance"
        warning_history:
          type: array
          items:
            $ref: "#/components/schemas/VendorWarning"
        kyc_documents:
          type: array
          description: Submitted KYC evidence; empty for vendors seeded pre-KYC.
          items:
            $ref: "#/components/schemas/KycDocument"
        created_at:
          type: string
          format: date-time

    VendorPage:
      type: object
      required: [data, next_cursor, prev_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Vendor"
        next_cursor:
          type: [string, "null"]
        prev_cursor:
          type: [string, "null"]

    # -- listings -----------------------------------------------------------
    ListingStatus:
      type: string
      enum: [DRAFT, PENDING_REVIEW, APPROVED, REJECTED, ARCHIVED]
      description: >-
        Approval-queue machine: DRAFT → PENDING_REVIEW (vendor submits);
        PENDING_REVIEW → APPROVED | REJECTED; APPROVED → ARCHIVED;
        REJECTED → ARCHIVED | PENDING_REVIEW. Admins never touch DRAFT.

    ListingReviewEntry:
      type: object
      required: [action, admin_id, reason, at]
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [APPROVED, REJECTED, ARCHIVED]
        admin_id:
          type: string
        reason:
          type: string
        at:
          type: string
          format: date-time

    ListingComment:
      type: object
      required: [id, author_admin_id, body, at]
      additionalProperties: false
      properties:
        id:
          type: string
        author_admin_id:
          type: string
        body:
          type: string
        at:
          type: string
          format: date-time

    Listing:
      type: object
      required: [id, vendor_id, title, category, description, unit, price_cents, stock_kg, status, submitted_at, review_history, comments]
      additionalProperties: false
      properties:
        id:
          type: string
        vendor_id:
          type: string
        title:
          type: string
        category:
          type: string
        description:
          type: string
        unit:
          type: string
          description: 'Human-facing selling unit, e.g. 500g bunch.'
        price_cents:
          type: integer
          minimum: 0
        stock_kg:
          type: number
          minimum: 0
        status:
          $ref: "#/components/schemas/ListingStatus"
        submitted_at:
          type: [string, "null"]
          format: date-time
          description: Null while DRAFT (not yet submitted for review).
        reviewed_at:
          type: string
          format: date-time
        review_history:
          type: array
          items:
            $ref: "#/components/schemas/ListingReviewEntry"
        comments:
          type: array
          items:
            $ref: "#/components/schemas/ListingComment"

    ListingPage:
      type: object
      required: [data, next_cursor, prev_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Listing"
        next_cursor:
          type: [string, "null"]
        prev_cursor:
          type: [string, "null"]
        total:
          type: integer
          description: Total rows after filtering, before pagination.
        total_by_status:
          type: object
          description: >-
            Present when ?counts=status. Tallied before the status filter, so
            queue counters stay correct beyond the first page.
          additionalProperties:
            type: integer
          properties:
            DRAFT: { type: integer }
            PENDING_REVIEW: { type: integer }
            APPROVED: { type: integer }
            REJECTED: { type: integer }
            ARCHIVED: { type: integer }

    # -- payouts -------------------------------------------------------------
    PayoutStatus:
      type: string
      enum: [CALCULATED, PENDING_APPROVAL, APPROVED, PAID, FAILED]
      description: >-
        §5 batch machine: CALCULATED → PENDING_APPROVAL → APPROVED → PAID;
        FAILED reachable from APPROVED (bank transfer rejected) and retryable
        back to PENDING_APPROVAL.

    PayoutDecision:
      type: object
      required: [action, admin_id, reason, at]
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [SUBMITTED, APPROVED, PAID, RETRY]
        admin_id:
          type: string
        reason:
          type: string
        at:
          type: string
          format: date-time

    Payout:
      type: object
      required: [id, vendor_id, period_start, period_end, gross_cents, commission_cents, net_cents, orders_count, status, decision_history]
      additionalProperties: false
      properties:
        id:
          type: string
        vendor_id:
          type: string
        period_start:
          type: string
          format: date
          description: Inclusive start of the settlement period covered.
        period_end:
          type: string
          format: date
        gross_cents:
          type: integer
          minimum: 0
          description: Integer minor units (kobo); ₦1 = 100 kobo.
        commission_cents:
          type: integer
          minimum: 0
        net_cents:
          type: integer
          minimum: 0
          description: >-
            Always gross_cents − commission_cents. The calculate endpoint
            derives all three from the order ledger and rejects any batch
            where this invariant (or a caller's claimed amounts) fails.
        orders_count:
          type: integer
          minimum: 0
          description: Eligible orders summed into this batch.
        status:
          $ref: "#/components/schemas/PayoutStatus"
        failure_reason:
          type: string
          description: Set only when status is FAILED.
        approved_by_admin_id:
          type: string
        approved_at:
          type: string
          format: date-time
        paid_at:
          type: string
          format: date-time
        decision_history:
          type: array
          items:
            $ref: "#/components/schemas/PayoutDecision"

    PayoutPage:
      type: object
      required: [data, next_cursor, prev_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Payout"
        next_cursor:
          type: [string, "null"]
        prev_cursor:
          type: [string, "null"]
        total:
          type: integer
          description: Total rows after filtering, before pagination.
        total_by_status:
          type: object
          description: Present when ?counts=status (tallied before the status filter).
          additionalProperties:
            type: integer
          properties:
            CALCULATED: { type: integer }
            PENDING_APPROVAL: { type: integer }
            APPROVED: { type: integer }
            PAID: { type: integer }
            FAILED: { type: integer }

    # -- marketing -----------------------------------------------------------
    PromotionStatus:
      type: string
      enum: [DRAFT, SCHEDULED, LIVE, ENDED]
      description: >-
        Campaign lifecycle: DRAFT → SCHEDULED (admin schedules it) → LIVE
        (window opens) → ENDED (window closes or an admin ends it early).
        DRAFT can be ended only by editing, so it is excluded from `end`.

    Promotion:
      type: object
      required: [id, code, type, value, scope, starts_at, ends_at, usage_limit, used_count, status, created_by_admin_id, created_at]
      additionalProperties: false
      properties:
        id:
          type: string
        code:
          type: string
          description: Customer-facing coupon code (uppercased).
        type:
          type: string
          enum: [PERCENT, FIXED, FREE_SHIPPING]
        value:
          type: integer
          minimum: 0
          description: >-
            PERCENT → whole percent (50 = 50%); FIXED → kobo; 0 for
            FREE_SHIPPING.
        scope:
          type: string
          enum: [GLOBAL, CATEGORY, VENDOR]
        scope_ref:
          type: string
          description: Category slug or vendor id when scope is not GLOBAL.
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        usage_limit:
          type: integer
          minimum: 1
        used_count:
          type: integer
          minimum: 0
        status:
          $ref: "#/components/schemas/PromotionStatus"
        created_by_admin_id:
          type: string
        created_at:
          type: string
          format: date-time

    PromotionPage:
      type: object
      required: [data, next_cursor, prev_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Promotion"
        next_cursor:
          type: [string, "null"]
        prev_cursor:
          type: [string, "null"]
        total:
          type: integer
        total_by_status:
          type: object
          description: Present when ?counts=status (tallied before the status filter).
          additionalProperties:
            type: integer
          properties:
            DRAFT: { type: integer }
            SCHEDULED: { type: integer }
            LIVE: { type: integer }
            ENDED: { type: integer }

    NotificationAudience:
      type: string
      enum: [BUYERS, VENDORS, SEGMENT]

    NotificationStatus:
      type: string
      enum: [DRAFT, SCHEDULED, SENT]

    Notification:
      type: object
      required: [id, audience, title, body, status, created_by_admin_id, created_at]
      additionalProperties: false
      properties:
        id:
          type: string
        audience:
          $ref: "#/components/schemas/NotificationAudience"
        title:
          type: string
        body:
          type: string
        status:
          $ref: "#/components/schemas/NotificationStatus"
        scheduled_at:
          type: string
          format: date-time
        sent_at:
          type: string
          format: date-time
        created_by_admin_id:
          type: string
        created_at:
          type: string
          format: date-time

    NotificationPage:
      type: object
      required: [data, next_cursor, prev_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        next_cursor:
          type: [string, "null"]
        prev_cursor:
          type: [string, "null"]
        total:
          type: integer

    # -- analytics ------------------------------------------------------------
    GmvDay:
      type: object
      required: [date, gmv_cents, orders, commission_cents]
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
        gmv_cents:
          type: integer
          minimum: 0
        orders:
          type: integer
          minimum: 0
        commission_cents:
          type: integer
          minimum: 0

    AnalyticsGmv:
      type: object
      required: [days, series, total_gmv_cents, total_orders]
      additionalProperties: false
      properties:
        days:
          type: integer
        series:
          type: array
          description: One row per day, oldest first, zero-filled.
          items:
            $ref: "#/components/schemas/GmvDay"
        total_gmv_cents:
          type: integer
        total_orders:
          type: integer

    AnalyticsTakeRate:
      type: object
      required: [gmv_cents, commission_cents, take_rate, orders_count]
      additionalProperties: false
      properties:
        gmv_cents:
          type: integer
        commission_cents:
          type: integer
        take_rate:
          type: number
          description: commission_cents / gmv_cents over the window (0 when GMV is 0).
        orders_count:
          type: integer

    LeaderboardRow:
      type: object
      required: [rank, vendor_id, business_name, gmv_cents, orders, rating, cancellation_rate]
      additionalProperties: false
      properties:
        rank:
          type: integer
          minimum: 1
        vendor_id:
          type: string
        business_name:
          type: string
        gmv_cents:
          type: integer
        orders:
          type: integer
        rating:
          type: number
        cancellation_rate:
          type: number

    AnalyticsQuality:
      type: object
      required: [orders_count, cancellation_rate, late_shipment_rate, spoilage_complaints, disputes_open]
      additionalProperties: false
      properties:
        orders_count:
          type: integer
        cancellation_rate:
          type: number
        late_shipment_rate:
          type: number
        spoilage_complaints:
          type: integer
        disputes_open:
          type: integer

    # -- audit ---------------------------------------------------------------
    AuditEntityType:
      type: string
      enum: [ORDER, DISPUTE, VENDOR]

    AuditLog:
      type: object
      required: [id, actor_admin_id, action, entity_type, entity_id, reason, ip, at]
      additionalProperties: false
      properties:
        id:
          type: string
        actor_admin_id:
          type: string
        action:
          type: string
          description: e.g. order.status-override, dispute.resolve, vendor.suspend.
        entity_type:
          $ref: "#/components/schemas/AuditEntityType"
        entity_id:
          type: string
        before:
          type: [object, "null"]
          additionalProperties: true
        after:
          type: [object, "null"]
          additionalProperties: true
        reason:
          type: string
        ip:
          type: string
        at:
          type: string
          format: date-time

    AuditLogPage:
      type: object
      required: [data, next_cursor, prev_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
        next_cursor:
          type: [string, "null"]
        prev_cursor:
          type: [string, "null"]

  responses:
    Error400:
      description: Malformed request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error401:
      description: Missing/invalid credentials or MFA challenge failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error403:
      description: Authenticated but the role lacks permission (RBAC matrix, §9).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error404:
      description: Not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error409:
      description: Illegal state transition for the current entity status.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error422:
      description: Semantically invalid — e.g. resolution amount exceeds disputed amount.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
